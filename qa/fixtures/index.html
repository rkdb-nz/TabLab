<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sitecheck standalone fixture</title><style>body{font:16px/1.5 system-ui;margin:0;color:#182029;background:#fff}main,footer{max-width:60rem;padding:24px;margin:auto}h1{font-size:32px}button,input{font:inherit;padding:10px;max-width:100%;box-sizing:border-box}label{display:block}section{margin:60px 0}dialog{max-width:min(500px,80vw);padding:20px}iframe{width:100%;height:70px;border:1px solid #888}</style></head><body><main><h1>Standalone site fixture</h1><p>This local page checks that ordinary scrolling content and an embedded frame are handled correctly.</p><button id="open" onclick="document.querySelector('dialog').showModal()">Open contact</button><section><h2>Embedded content</h2><iframe title="Embedded placeholder" src="about:blank"></iframe></section><section style="min-height:900px"><h2>Long page</h2><p>The footer is intentionally below the first screen. This is normal page scrolling.</p></section></main><footer><p>End of page</p></footer><dialog class="overlay"><form onsubmit="event.preventDefault();document.querySelector('#status').textContent='Demo purposes only. No message has been sent.'"><h2>Contact</h2><label>Email <input name="email" type="email" required></label><button type="submit">Send demo</button><p id="status" role="status"></p><button type="button" onclick="this.closest('dialog').close()">Close</button></form></dialog></body></html>
