<!doctype html><meta charset="utf-8"><title>Board button review</title><style>body{font:18px Arial;background:#eee}button,select{font:inherit;padding:8px}iframe{display:block;border:1px solid #444}pre{white-space:pre-wrap}</style><h1>Board button review</h1><select id="board"><option>billboard</option><option>noticeboard</option><option>skateboard</option><option selected>springboard</option></select><select id="size"><option value="360,800">360 × 800</option><option value="390,844" selected>390 × 844</option><option value="412,915">412 × 915</option><option value="800,360">800 × 360</option><option value="915,412">915 × 412</option><option value="1366,900">Desktop</option></select><button id="show">Show board</button><button id="run">Check all boards and sizes</button><p id="status">Ready</p><pre id="result"></pre><iframe id="view" title="Board preview"></iframe><script>
const f=document.querySelector('#view'),s=document.querySelector('#status'),r=document.querySelector('#result');
async function load(board,w,h){f.style.width=w+'px';f.style.height=h+'px';await new Promise(resolve=>{f.onload=()=>setTimeout(resolve,600);f.src='/boardroom/'+board+'/'});}
function scan(){const d=f.contentDocument,w=f.contentWindow;w.scrollTo(0,240);const selector=w.innerWidth<=980?'.mobile-board-page .billboard-example small':'.desktop-board-page .demo-meta > span';return [...d.querySelectorAll(selector)].map(el=>{const range=d.createRange();range.selectNodeContents(el);const rect=el.getBoundingClientRect();return {scrollY:w.scrollY,headerTop:d.querySelector('.billboard-header').getBoundingClientRect().top,headerHeight:d.querySelector('.billboard-header').getBoundingClientRect().height,navTop:d.querySelector('.billboard-section-nav').getBoundingClientRect().top,navHeight:d.querySelector('.mobile-board-page .billboard-section-nav').getBoundingClientRect().height,text:el.textContent,width:rect.width,height:rect.height,lines:range.getClientRects().length,overflow:el.scrollWidth>el.clientWidth+1}})}
document.querySelector('#show').onclick=async()=>{const [w,h]=document.querySelector('#size').value.split(',');await load(document.querySelector('#board').value,w,h);r.textContent=JSON.stringify(scan(),null,2)};
document.querySelector('#run').onclick=async()=>{const result=[];for(const b of ['billboard','noticeboard','skateboard','springboard'])for(const [w,h]of [[360,800],[390,844],[412,915],[800,360],[915,412],[1366,900]]){s.textContent=`Checking ${b} ${w} × ${h}`;await load(b,w,h);result.push({board:b,size:w+'x'+h,buttons:scan()});r.textContent=JSON.stringify(result,null,2)}s.textContent='Complete: 24 board/viewport checks'};
document.querySelector('#show').click();
</script>
