<!doctype html><meta charset="utf-8"><title>Pottery 2.5 second photo review</title><style>body{font:18px Arial;background:#eee}button,select{font:inherit;padding:8px}pre{max-height:120px;overflow:auto}iframe{display:block;border:1px solid #333}</style><select><option value="390,700">Portrait</option><option value="800,360">Landscape</option></select><button id="show">Show</button><button id="next">Next photo</button><button id="read">Read</button><pre>Ready</pre><iframe id="view"></iframe><script>const f=document.querySelector('iframe'),r=document.querySelector('pre');let i=-1;document.querySelector('#show').onclick=()=>{i=-1;const[w,h]=document.querySelector('select').value.split(',');f.width=w;f.height=h;f.src='/boardroom/skateboard/demos/pottery/site.html';};document.querySelector('#next').onclick=()=>{const all=[...f.contentDocument.querySelectorAll('.reveal-img')];i=(i+1)%all.length;all[i].scrollIntoView({behavior:'instant',block:'center'});};document.querySelector('#read').onclick=()=>{const d=f.contentDocument,w=f.contentWindow,all=[...d.querySelectorAll('.reveal-img')],e=all[Math.max(0,i)],c=e.querySelector('.mobile-photo-curtain');r.textContent=JSON.stringify({photo:i+1,total:all.length,panel:d.querySelector('#motion-test-panel')!==null,curtain:w.getComputedStyle(c).backgroundColor,hidden:c.hidden,animations:e.getAnimations({subtree:true}).map(a=>({duration:a.effect.getTiming().duration,property:Object.keys(a.effect.getKeyframes()[0])})),pageWidth:d.documentElement.scrollWidth,viewport:w.innerWidth},null,2);};document.querySelector('#show').click();</script>
