<!doctype html><meta charset="utf-8"><title>Mobile demo review</title><style>body{font:18px Arial;background:#eee}button,select{font:inherit;padding:8px}pre{white-space:pre-wrap;max-height:180px;overflow:auto}iframe{display:block;border:1px solid #444}</style><h1>Mobile demo review</h1><select id="board"><option>billboard</option><option>noticeboard</option><option>skateboard</option><option selected>springboard</option></select><select id="size"><option value="390,700">Portrait</option><option value="800,360">Landscape</option><option value="1366,900">Desktop</option></select><label><input type="checkbox" id="native">Allow native fullscreen</label><button id="show">Show gallery</button><button id="run">Test all twelve demos</button><p id="status">Ready</p><pre id="result"></pre><iframe id="view" title="Mobile gallery" allow="fullscreen 'none'"></iframe><script>
const f=document.querySelector('#view'),s=document.querySelector('#status'),r=document.querySelector('#result');
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function load(b,w,h){f.style.width=w+'px';f.style.height=h+'px';f.allow=document.querySelector('#native').checked?'fullscreen':"fullscreen 'none'";await new Promise(resolve=>{f.onload=()=>setTimeout(resolve,400);f.src='/boardroom/'+b+'/'});}
document.querySelector('#show').onclick=async()=>{const [w,h]=document.querySelector('#size').value.split(',');await load(document.querySelector('#board').value,w,h);r.textContent='Gallery ready';};
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;const all=[];for(const b of ['billboard','noticeboard','skateboard','springboard'])for(const [w,h]of [[390,700],[800,360]]){await load(b,w,h);const d=f.contentDocument,win=f.contentWindow;const links=[...d.querySelectorAll('.mobile-board-page .billboard-example')];for(const link of links){s.textContent=`Checking ${b} ${link.querySelector('strong').textContent} ${w}×${h}`;const before=win.scrollY;link.click();const overlay=d.querySelector('.board-demo-overlay'),demo=overlay?.querySelector('iframe');if(!overlay){all.push({board:b,size:w+'x'+h,error:'No overlay'});continue;}await Promise.race([new Promise(resolve=>demo.addEventListener('load',resolve,{once:true})),pause(12000)]);const box=overlay.getBoundingClientRect();let title;try{title=demo.contentDocument.title}catch{title='unreadable'}const row={board:b,size:w+'x'+h,name:link.querySelector('strong').textContent,src:demo.getAttribute('src'),title,fullWindow:box.x===0&&box.y===0&&Math.abs(box.width-w)<2&&Math.abs(box.height-h)<2,returnTabs:overlay.querySelectorAll('button').length};await new Promise(resolve=>{win.addEventListener('popstate',resolve,{once:true});overlay.querySelector('button').click()});await pause(80);row.returned=!d.querySelector('.board-demo-overlay')&&Math.abs(win.scrollY-before)<2;all.push(row);r.textContent=JSON.stringify(all,null,2);}}s.textContent=`Complete: ${all.length} demo/orientation checks`;document.querySelector('#run').disabled=false;};document.querySelector('#show').click();
</script>
