<!doctype html><meta charset="utf-8"><title>Compact pottery cards review</title><style>body{font:18px Arial;background:#eee}select,button{font:inherit;padding:8px}pre{max-height:120px;overflow:auto}iframe{display:block;border:1px solid #333}</style><select><option value="390,700">Portrait</option><option value="800,360">Landscape</option><option value="1366,900">Desktop</option><option value="320,568">Small phone</option></select><button id="show">Show</button><button id="read">Read fit</button><pre>Ready</pre><iframe></iframe><script>const f=document.querySelector('iframe');document.querySelector('#show').onclick=()=>{const [w,h]=document.querySelector('select').value.split(',');f.width=w;f.height=h;f.src='/boardroom/skateboard/demos/pottery/site.html#materials';};document.querySelector('#read').onclick=()=>{const d=f.contentDocument,w=f.contentWindow,c=[...d.querySelectorAll('.philosophy-card')];document.querySelector('pre').textContent=JSON.stringify({size:f.width+'x'+f.height,pageWidth:d.documentElement.scrollWidth,viewport:w.innerWidth,columns:w.getComputedStyle(d.querySelector('.philosophy-grid')).gridTemplateColumns,cards:c.map(e=>({width:e.clientWidth,scroll:e.scrollWidth,height:e.clientHeight,text:w.getComputedStyle(e.querySelector('.philosophy-short')).display}))},null,2);};document.querySelector('#show').click();</script>
