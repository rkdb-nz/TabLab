<!doctype html><meta charset="utf-8"><title>Choose responsive review</title><style>body{margin:12px;font:16px Arial;background:#ddd}button{padding:10px;margin:3px}iframe{display:block;border:0}</style><div id="controls"></div><button id="double">Double text</button><button id="normal">Normal text</button><iframe id="view" src="./#explore" width="390" height="700"></iframe><script>[[320,568],[360,640],[390,700],[412,820],[768,1024],[820,1180],[844,390],[667,375],[568,320],[1024,768],[1280,800],[821,1180],[1101,700]].forEach(([w,h])=>{const b=document.createElement('button');b.textContent=w+' × '+h;b.onclick=()=>{view.width=w;view.height=h};controls.append(b)});document.getElementById('double').onclick=()=>view.contentDocument.querySelectorAll('#exploreScreen h2,#exploreScreen p,#exploreScreen .explore-kicker,#exploreScreen .explore-choice').forEach(e=>{e.dataset.old=e.getAttribute('style')||'';e.style.setProperty('font-size',parseFloat(getComputedStyle(e).fontSize)*2+'px','important')});normal.onclick=()=>view.contentDocument.querySelectorAll('[data-old]').forEach(e=>{e.setAttribute('style',e.dataset.old);delete e.dataset.old});</script>
