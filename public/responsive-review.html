<!doctype html><meta charset="utf-8"><title>Tab Lab responsive review</title>
<style>body{margin:12px;font:16px Arial;background:#ddd;color:#111}button{padding:10px;margin:3px}iframe{display:block;border:0;background:white}pre{white-space:pre-wrap;font:13px monospace;margin:8px}</style>
<div id="controls"></div><button id="large">200% text</button><button id="normal">Normal text</button>
<pre id="result">Loading</pre><iframe id="view" src="./#make-site" width="390" height="700"></iframe>
<script>
const presets=[[320,568],[360,640],[390,700],[412,820],[768,1024],[820,1180],[844,390],[667,375],[568,320],[1024,768],[1280,800]];
let large=false;
function inspect(){const w=view.contentWindow,d=w.document,p=d.querySelector('#sortPanel');if(!p)return;
const rect=s=>{const e=d.querySelector(s),r=e.getBoundingClientRect();return{x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom}};
const title=rect('#sortPanel .sort-title'),line=rect('#sortPanel .sort-lines'),action=rect('#sortPanel .sort-actions'),button=rect('#sortPanel .hero-button'),landing=d.querySelector('.landing');
result.textContent=JSON.stringify({viewport:[w.innerWidth,w.innerHeight],largeText:large,title,line,action,button,gap:action.y-line.bottom,overlap:title.bottom>line.y||line.bottom>action.y,clippedX:[title,line,button].some(r=>r.x<0||r.right>w.innerWidth),belowViewport:button.bottom>w.innerHeight,scrollAvailable:getComputedStyle(landing).overflowY,scrollHeight:landing.scrollHeight,contentHeight:landing.clientHeight},null,0);}
function textSize(){const d=view.contentDocument;let s=d.getElementById('review-text');if(!s){s=d.createElement('style');s.id='review-text';d.head.append(s);}s.textContent=large?'html {font-size:32px !important} #sortPanel .sort-title,#sortPanel .sort-lines {font-size:2em !important} #sortPanel .hero-button {font-size:2rem !important}':'';setTimeout(inspect,150);}
presets.forEach(([w,h])=>{const b=document.createElement('button');b.textContent=w+' × '+h;b.onclick=()=>{view.width=w;view.height=h;setTimeout(inspect,350)};controls.append(b)});
view.onload=()=>setTimeout(inspect,600);large.onclick=()=>{};document.getElementById('large').onclick=()=>{large=true;textSize()};normal.onclick=()=>{large=false;textSize()};
</script>
