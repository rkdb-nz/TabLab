<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tab Lab mobile preview</title><style>body{margin:0;padding:18px;background:#eee8df;color:#34291f;font:16px Arial}header{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}button,select{font:inherit;padding:8px}iframe{display:block;border:1px solid #816a58;background:white}main{overflow:auto}h1{font-size:20px;margin:0}</style><header><h1>Mobile preview</h1><select aria-label="Website example" id="example"></select><button id="portrait">Portrait</button><button id="landscape">Landscape</button></header><main><iframe id="phone" width="360" height="740" title="Phone preview" allow="fullscreen"></iframe></main><script>const demos=['billboard/demos/donut','billboard/demos/mini-golf','billboard/demos/drilling','noticeboard/demos/diner','noticeboard/demos/produce','noticeboard/demos/charity-walk','skateboard/demos/florist','skateboard/demos/pottery','skateboard/demos/tailor','springboard/demos/dining','springboard/demos/retreat','springboard/demos/theatre'];const select=document.getElementById('example'),phone=document.getElementById('phone');demos.forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p.split('/').pop().replaceAll('-',' ');select.append(o)});function load(){phone.src=select.value+'/'}select.onchange=load;document.getElementById('portrait').onclick=()=>{phone.width=360;phone.height=740};document.getElementById('landscape').onclick=()=>{phone.width=740;phone.height=360};load();</script></html>
