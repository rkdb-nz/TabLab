<!doctype html><meta charset="utf-8"><title>Pottery mobile motion review</title><style>body{font:18px Arial;background:#eee}button,select{font:inherit;padding:8px}pre{max-height:100px;overflow:auto}iframe{display:block;border:1px solid #333}</style><select id="size"><option value="390,700">Portrait</option><option value="800,360">Landscape</option><option value="1366,900">Desktop</option></select><button id="show">Show</button><button id="before">Photo below midpoint</button><button id="studio">Reveal studio photo</button><button id="drift">Scroll past photo</button><button id="read">Read state</button><pre id="result">Ready</pre><iframe id="view"></iframe><script>
const f=document.querySelector('iframe'),r=document.querySelector('pre');document.querySelector('#show').onclick=()=>{const [w,h]=document.querySelector('select').value.split(',');f.width=w;f.height=h;f.src='/boardroom/skateboard/demos/pottery/site.html';};document.querySelector('#before').onclick=()=>{const e=f.contentDocument.querySelector('.studio .reveal-img');f.contentWindow.scrollTo({top:f.contentWindow.scrollY+e.getBoundingClientRect().top-f.contentWindow.innerHeight*.65,behavior:'instant'});};document.querySelector('#studio').onclick=()=>{const e=f.contentDocument.querySelector('.studio .reveal-img');f.contentWindow.scrollTo({top:f.contentWindow.scrollY+e.getBoundingClientRect().top-f.contentWindow.innerHeight*.35,behavior:'instant'});};document.querySelector('#drift').onclick=()=>f.contentWindow.scrollBy({top:140,behavior:'instant'});document.querySelector('#read').onclick=()=>{const d=f.contentDocument,w=f.contentWindow,e=d.querySelector('.studio .reveal-img'),img=e.querySelector('img'),s=w.getComputedStyle(img);r.textContent=JSON.stringify({size:f.width+'x'+f.height,revealed:e.classList.contains('in'),transition:s.transitionDuration,scale:s.transform,drift:s.translate,curtain:w.getComputedStyle(e,'::after').transitionDuration,scroll:w.scrollY,overflow:d.documentElement.scrollWidth>w.innerWidth},null,2);};document.querySelector('#show').click();</script>
