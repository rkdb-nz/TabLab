springboard/demos/theatre/now-playing.html", "/boardroom/springboard/demos/theatre/site.html", "/boardroom/springboard/index.html", "/foundrycare/index.html", "/index.html", "/maintenance/index.html", "/start/index.html", "/the-foundry/index.html", "/whywebsite/index.html"]; const frame=document.querySelector('#view'), status=document.querySelector('#status'), results=document.querySelector('#results');

async function load(p,w,h){frame.style.width=w+'px';frame.style.height=h+'px';await new Promise(resolve=>{let done=false;const finish=()=>{if(!done){done=true;resolve()}};frame.onload=()=>setTimeout(finish,450);frame.src=p;setTimeout(finish,12000)});}
function scan(doc,route,size,out){
 const win=doc.defaultView;
 const visible=e=>{for(;e&&e.nodeType===1;e=e.parentElement){const c=win.getComputedStyle(e);if(c.display==='none'||c.visibility==='hidden')return false;}return true;};
 for(const br of doc.querySelectorAll('br')){if(win.getComputedStyle(br).display!=='none'||!visible(br.parentElement))continue;const before=br.previousSibling,after=br.nextSibling;if(before&&after){const a=before.textContent,b=after.textContent;if(a&&b&&!/\s$/.test(a)&&!/^\s/.test(b)&&/[\w.!?&;]$/.test(a)&&/^\w/.test(b))out.push({route,size,kind:'hidden break joins words',text:br.parentElement.textContent.trim()});}}
 for(const el of doc.querySelectorAll('p,h1,h2,h3,h4,label,button,li')){if(!visible(el))continue;const txt=el.innerText;if(/[a-z][.!?][A-Z][a-z]/.test(txt))out.push({route,size,kind:'missing space after punctuation',text:txt.slice(0,240)});}

load(paths[0],390,844);
</script>
