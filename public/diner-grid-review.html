<!doctype html><meta charset="utf-8"><title>Diner grid review</title><style>body{font:18px Arial;background:#eee}select,button{font:inherit;padding:8px}pre{max-height:150px;overflow:auto}iframe{display:block;border:1px solid #333}</style><select id="size"><option value="390,700">Portrait</option><option value="800,360">Landscape</option><option value="1366,900">Desktop</option></select><button id="show">Show</button><button id="check">Check categories</button><pre id="result">Ready</pre><iframe id="view"></iframe><script>
const f=document.querySelector('iframe'),r=document.querySelector('pre');
document.querySelector('#show').onclick=()=>{const [w,h]=document.querySelector('select').value.split(',');f.width=w;f.height=h;f.onload=()=>{f.contentDocument.querySelector('[data-panel="menu-panel"]').click();r.textContent='Menu ready';};f.src='/boardroom/noticeboard/demos/diner/site.html';};
document.querySelector('#check').onclick=()=>{const d=f.contentDocument,w=f.contentWindow,t=d.querySelector('.menu-tabs'),tabs=[...t.querySelectorAll('button')],box=t.getBoundingClientRect();tabs.at(-1).click();r.textContent=JSON.stringify({size:f.width+'x'+f.height,count:tabs.length,columns:w.getComputedStyle(t).gridTemplateColumns,sidewaysOverflow:t.scrollWidth>t.clientWidth+1,allInside:tabs.every(b=>{const r=b.getBoundingClientRect();return r.left>=box.left&&r.right<=box.right+1}),selected:d.querySelector('.category-panel.active').dataset.categoryPanel,labels:tabs.map(b=>b.textContent.trim())},null,2);};document.querySelector('#show').click();</script>
