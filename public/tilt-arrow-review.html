<!doctype html><meta charset="utf-8"><title>Tilt and arrow checks</title><style>body{font:18px Arial;background:#eee}iframe{display:block;border:1px solid #333}button,select{font:inherit;padding:8px}pre{white-space:pre-wrap;max-height:120px;overflow:auto}</style><select id="demo"><option value="donut">Donut</option><option value="diner">Diner</option></select><select id="size"><option value="390,700">Portrait</option><option value="800,360">Landscape</option><option value="1366,900">Desktop</option></select><button id="show">Show</button><button id="test">Test</button><pre id="result">Ready</pre><iframe id="view"></iframe><script>
const f=document.querySelector('iframe'),r=document.querySelector('pre'),pause=ms=>new Promise(ok=>setTimeout(ok,ms));
document.querySelector('#show').onclick=()=>{const [w,h]=document.querySelector('#size').value.split(',');f.width=w;f.height=h;f.src=document.querySelector('#demo').value==='donut'?'/boardroom/billboard/demos/donut/site.html':'/boardroom/noticeboard/demos/diner/site.html';};
document.querySelector('#test').onclick=async()=>{const d=f.contentDocument,w=f.contentWindow,rows=[];if(document.querySelector('#demo').value==='donut'){d.querySelector('[data-overlay="menu"]').click();await pause(750);const o=d.querySelector('#overlay-menu'),c=o.querySelector('.overlay-close'),p=o.querySelector('.overlay-panel');rows.push({transition:w.getComputedStyle(c).transitionDuration,duration:w.getComputedStyle(o).getPropertyValue('--donut-close-duration')});c.click();await pause(800);rows.push({at800ms:{hidden:o.hidden,transform:w.getComputedStyle(c).transform,panel:w.getComputedStyle(p).transform,opacity:w.getComputedStyle(p).opacity}});await pause(1100);rows.push({at1900ms:{hidden:o.hidden,transform:w.getComputedStyle(c).transform,panel:w.getComputedStyle(p).transform}});await pause(350);rows.push({at2250ms:{hidden:o.hidden}});}else{d.querySelector('[data-panel="menu-panel"]').click();await pause(400);const t=d.querySelector('.menu-tabs'),back=d.querySelector('.category-arrow--back'),next=d.querySelector('.category-arrow--next');rows.push({start:{left:t.scrollLeft,back:back.disabled,next:next.disabled,arrowDisplay:w.getComputedStyle(next).display,glow:w.getComputedStyle(next).animationName,width:t.clientWidth,scrollWidth:t.scrollWidth}});next.click();await pause(600);rows.push({afterNext:{left:t.scrollLeft,back:back.disabled,next:next.disabled}});back.click();await pause(600);rows.push({afterBack:{left:t.scrollLeft,back:back.disabled}});}r.textContent=JSON.stringify(rows,null,2);};document.querySelector('#show').click();</script>
