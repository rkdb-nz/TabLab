name: Sitewide targeted repairs
on:
  push:
    branches: ['repair/sitewide-2026-10-28']
    paths: ['public/**', 'qa/sitewide/**', '.github/workflows/sitecheck-repairs.yml']
permissions:
  contents: read
jobs:
  retest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CHECK_TASK: repairs
      AUDIT_SOURCE_COMMIT: 7410e040214f7369013a41d47aa3422e4c4bd6e0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix qa/sitewide --no-audit --no-fund
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: qa/sitewide
      - run: node qa/sitewide/verify.cjs
      - run: node qa/sitewide/run.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sitewide-repair-retest
          path: sitecheck-evidence/sitewide-2026-10-28/repairs/
          retention-days: 90
