name: Sitecheck focused mobile fullscreen
on:
  pull_request:
    paths: ['qa/**', '.github/workflows/sitecheck-readiness.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --prefix qa --ignore-scripts
      - run: node qa/node_modules/playwright/cli.js install --with-deps chromium
      - name: Focused settled mobile fullscreen and return only
        run: node qa/minigolf-fullscreen.mjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: minigolf-mobile-fullscreen
          path: qa/minigolf-results/
          retention-days: 3
