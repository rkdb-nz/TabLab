name: Charity Walk routine sitecheck
on:
  pull_request:
    paths: ['qa/charity-routine.mjs', '.github/workflows/sitecheck-readiness.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --prefix qa --ignore-scripts
      - run: timeout 240s node qa/node_modules/playwright/cli.js install --with-deps ${{ matrix.browser }}
      - name: Charity Walk routine nine-combination sample
        run: node qa/charity-routine.mjs
        env:
          QA_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: charity-${{ matrix.browser }}
          path: qa/charity-results/
          retention-days: 90
