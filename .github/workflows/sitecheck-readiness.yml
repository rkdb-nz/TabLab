name: Produce routine sitecheck
on:
  pull_request:
    paths: ['qa/produce-routine.mjs', '.github/workflows/sitecheck-readiness.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --prefix qa --ignore-scripts
      - run: timeout 240s node qa/node_modules/playwright/cli.js install --with-deps ${{ matrix.browser }}
      - run: node qa/produce-routine.mjs
        env:
          QA_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: produce-${{ matrix.browser }}
          path: qa/produce-results/
          retention-days: 90
