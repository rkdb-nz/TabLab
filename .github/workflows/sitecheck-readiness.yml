name: Drilling routine sitecheck
on:
  pull_request:
    paths: ['qa/**', '.github/workflows/sitecheck-readiness.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --prefix qa --ignore-scripts
      - run: node qa/node_modules/playwright/cli.js install --with-deps ${{ matrix.engine }}
      - name: Drilling slim routine sample
        run: node qa/drilling-audit.mjs
        env:
          QA_BROWSER: ${{ matrix.engine }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: drilling-${{ matrix.engine }}
          path: qa/drilling-results/
          retention-days: 90
