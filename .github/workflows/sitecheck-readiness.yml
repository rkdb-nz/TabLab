name: Sitecheck tool readiness
on:
  pull_request:
    paths: ['qa/**', '.github/workflows/sitecheck-readiness.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --prefix qa --ignore-scripts
      - run: node qa/node_modules/playwright/cli.js install --with-deps ${{ matrix.browser }}
      - name: Prove source, browser, interaction and screenshot capture
        env:
          QA_BROWSER: ${{ matrix.browser }}
          SITECHECK_OUTPUT: qa/readiness-results/${{ matrix.browser }}
        run: node qa/readiness.mjs qa/minigolf-readiness.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: sitecheck-readiness-${{ matrix.browser }}
          path: qa/readiness-results/
          retention-days: 3
