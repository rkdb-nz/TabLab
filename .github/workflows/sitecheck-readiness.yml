name: Theatre missing capture recovery
on:
  pull_request:
    paths: ['qa/theatre-capture-recovery.mjs', '.github/workflows/sitecheck-readiness.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --prefix qa --ignore-scripts
      - if: matrix.browser != 'chromium'
        run: timeout 240s node qa/node_modules/playwright/cli.js install --with-deps ${{ matrix.browser }}
      - run: node qa/theatre-capture-recovery.mjs
        env:
          QA_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: theatre-recovered-${{ matrix.browser }}
          path: qa/theatre-results/
          retention-days: 90
