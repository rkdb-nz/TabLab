name: Pottery routine sitecheck
on:
  push:
    branches: ['qa/pottery-routine']
    paths: ['qa/pottery-routine.mjs', 'public/boardroom/skateboard/demos/pottery/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --prefix qa --ignore-scripts
      - if: matrix.browser != 'chromium'
        run: timeout 240s node qa/node_modules/playwright/cli.js install --with-deps ${{ matrix.browser }}
      - run: node qa/pottery-routine.mjs
        env:
          QA_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: pottery-settled-${{ matrix.browser }}
          path: qa/pottery-settled-results/
          retention-days: 90
