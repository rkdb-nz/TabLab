name: Florist routine sitecheck
on:
  pull_request:
    paths: ['qa/florist-routine.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --prefix qa --ignore-scripts
      - name: Routine florist sample
        run: node qa/florist-routine.mjs
        env:
          QA_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: florist-${{ matrix.browser }}
          path: qa/florist-results/
          retention-days: 90
