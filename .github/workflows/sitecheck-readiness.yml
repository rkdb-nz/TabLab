name: Drilling focused Firefox repair verification
on:
  pull_request:
    paths: ['qa/**', 'public/boardroom/billboard/demos/drilling/**', '.github/workflows/sitecheck-readiness.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --prefix qa --ignore-scripts
      - run: timeout 180s node qa/node_modules/playwright/cli.js install --with-deps ${{ matrix.engine }}
      - name: Targeted repairs plus routine smoke sample
        run: node qa/drilling-focused-repair.mjs
        env:
          QA_BROWSER: ${{ matrix.engine }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: drilling-focused-repairs-firefox
          path: qa/drilling-focused-repair-results/
          retention-days: 90
