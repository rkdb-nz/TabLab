name: Minigolf targeted Chrome recovery only
on:
  pull_request:
    paths: ['qa/**', '.github/workflows/sitecheck-readiness.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --prefix qa --ignore-scripts
      - name: Locate runner Chrome without downloads or dependency installation
        run: |
          browser_path=$(command -v google-chrome || command -v chromium || true)
          test -n "$browser_path" || { echo 'No installed Chrome/Chromium on runner'; exit 1; }
          echo "QA_CHROME_EXECUTABLE=$browser_path" >> "$GITHUB_ENV"
          "$browser_path" --version
      - name: Remaining targeted Chromium checks only
        env:
          QA_BROWSER: chromium
        run: node qa/minigolf-audit.mjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: minigolf-targeted-chrome-recovery
          path: qa/minigolf-results/
          retention-days: 3
