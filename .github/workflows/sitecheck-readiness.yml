name: Drilling missing Chrome and native zoom only
on:
  pull_request:
    paths: ['qa/**', '.github/workflows/sitecheck-readiness.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --prefix qa --ignore-scripts
      - run: timeout 240s node qa/node_modules/playwright/cli.js install --with-deps chromium
      - name: Only missing Chrome sample and native 200 percent zoom
        run: node qa/drilling-chrome-completion.mjs
        env:
          QA_BROWSER: chromium
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: drilling-chrome-completion
          path: qa/drilling-chrome-completion/
          retention-days: 90
