name: Tailor focused completion
on:
  pull_request:
    paths: ['qa/tailor-routine.mjs', '.github/workflows/sitecheck-readiness.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --prefix qa --ignore-scripts
      - run: node qa/tailor-routine.mjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: tailor-completion
          path: qa/tailor-results/
          retention-days: 90
