name: Minigolf live preview proof
on:
  pull_request:
    paths: ['sitecheck-tools/minigolf-live.mjs', '.github/workflows/minigolf-live-probe.yml']
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --prefix qa --ignore-scripts
      - run: node qa/node_modules/playwright/cli.js install --with-deps ${{ matrix.browser }}
      - env:
          QA_BROWSER: ${{ matrix.browser }}
          PREVIEW_ORIGIN: https://6568400f.foundry-a3k.pages.dev
        run: SITECHECK_COMMIT=$(git rev-parse HEAD) node sitecheck-tools/minigolf-live.mjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: minigolf-live-${{ matrix.browser }}
          path: qa/live-results/
          retention-days: 3
