name: Produce final live verification
on:
  pull_request:
    paths: ['qa/produce-final.mjs', '.github/workflows/produce-final.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --prefix qa --ignore-scripts
      - if: matrix.browser == 'firefox'
        run: timeout 120s node qa/node_modules/playwright/cli.js install firefox
      - run: xvfb-run -a node qa/produce-final.mjs
        env:
          QA_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: produce-final-${{ matrix.browser }}
          path: qa/produce-final-results/
          retention-days: 90
