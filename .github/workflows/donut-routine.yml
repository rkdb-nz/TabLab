name: Donut routine sitecheck
on:
  pull_request:
    paths: ['qa/**', '.github/workflows/donut-routine.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  routine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --prefix qa --ignore-scripts
      - run: node qa/node_modules/playwright/cli.js install --with-deps chromium
      - run: node qa/donut-focused.mjs
        env:
          QA_BROWSER: chromium
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: donut-chromium
          path: qa/donut-results/
          retention-days: 90
